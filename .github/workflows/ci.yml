name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (mypy, strict)
        run: uv run mypy src/

      - name: Run tests with coverage gate (pytest)
        run: uv run pytest --cov=src/sentinel --cov-report=term-missing --cov-fail-under=95.8

  test-dependency-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project at dependency floors
        run: uv sync --resolution lowest-direct

      - name: Run tests (pytest)
        run: uv run pytest
        env:
          UV_NO_SYNC: "1"

  test-built-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel
        run: uv build

      - name: Install wheel in clean environment
        run: |
          uv venv "$RUNNER_TEMP/sentinel-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/sentinel-wheel/bin/python" dist/*.whl

      - name: Import installed server outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sentinel-wheel/bin/python" -c "import sentinel.server"

      - name: Start installed console script outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sentinel-wheel/bin/sentinel" < /dev/null

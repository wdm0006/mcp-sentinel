# Tag-triggered release build. No PyPI credentials exist here and none should:
# publishing to PyPI stays with the maintainer (e.g. `uv publish` on the
# downloaded artifacts, or a future trusted-publishing job by explicit choice).
# This workflow proves the artifacts are publish-ready: it builds the sdist and
# wheel from a tagged commit, smoke-tests the wheel outside the checkout, and
# attaches both to a draft GitHub release the maintainer publishes.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # First checkout is only there to make the selection script available; a
      # manual dispatch runs from a branch, so the tag to build is not known yet.
      - uses: actions/checkout@v4

      - name: Select the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          TAG="$(bash .github/scripts/select-release-tag.sh \
            "$GITHUB_EVENT_NAME" "$DISPATCH_TAG" "$GITHUB_REF_NAME")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Everything below builds the selected tag, not the ref the run started on.
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the tag matches the package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag $RELEASE_TAG (version $TAG_VERSION) does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/sentinel-release" --python 3.12
          uv pip install --python "$RUNNER_TEMP/sentinel-release/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sentinel-release/bin/python" -c "import sentinel.server"
          "$RUNNER_TEMP/sentinel-release/bin/sentinel-security-advisor" < /dev/null

      - name: Attach artifacts to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft --title "$RELEASE_TAG" --generate-notes \
            dist/*

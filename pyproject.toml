[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-security-advisor"
version = "0.1.0"
description = "MCP server that analyzes the security posture of your MCP tool setup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.6",
    "pydantic>=2.0.0",
]

[project.scripts]
sentinel = "sentinel.server:main"

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    # Exact pin: the lint/format gate must run the same ruff everywhere.
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

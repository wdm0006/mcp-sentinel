[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-security-advisor"
version = "0.1.0"
description = "MCP server that analyzes the security posture of your MCP tool setup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.6",
    "pydantic>=2.0.0",
]

[project.scripts]
sentinel = "sentinel.server:main"
# Same entry point under the PyPI project name (issue #25: naming pending review).
sentinel-security-advisor = "sentinel.server:main"

[dependency-groups]
dev = [
    "mutmut==3.7.0",
    "mypy>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    # The release-workflow guard parses .github/workflows/release.yml.
    "pyyaml>=6.0.2",
    # Exact pin: the lint/format gate must run the same ruff everywhere.
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect only the real suite: the mutmut shadow tree (mutants/tests/) has the
# same test basenames and would collide on import during plain pytest runs.
testpaths = ["tests"]
# A hung mutant must not wedge the campaign; the suite normally runs in ~1.5s.
timeout = 60

[tool.mutmut]
# The rule-engine module is the mutation target; explicit source_paths is the
# mutmut 3.7.0 form (tests_dir is deprecated).
source_paths = ["src/sentinel/server.py"]
# The shadow tree only gets Python sources and pyproject.toml; the guard tests
# read README.md and .github/ at the repo root, so copy those in as well.
also_copy = ["README.md", ".github"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
